<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コイン — Admin Login</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-card"><a href="index.html" class="logo"><div class="logo-icon">コ</div><div><span>コイン</span></div></a><span class="eyebrow">OPERATOR ACCESS</span><h1>Admin login</h1><p>Sign in to manage customer orders and payment verification. Customer notifications are handled automatically by コイン.</p><form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in <span>→</span></button><div id="error" class="auth-error"></div></form><a class="secondary-button auth-home" href="index.html">← Back to site</a></main><script>const form=document.getElementById('login'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const b=form.querySelector('button');b.disabled=true;b.textContent='Signing in…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Login failed');location.href='/admin.html'}catch(e){error.textContent=e.message;b.disabled=false;b.innerHTML='Sign in <span>→</span>'}});</script></body></html>
