<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コイン — Admin</title><link rel="stylesheet" href="style.css"><style>
.admin{width:min(1250px,calc(100% - 36px));margin:32px auto 70px}.admin-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px}.admin-top h1{font:700 34px "Space Grotesk",sans-serif}.admin-warning{padding:10px 13px;border:1px solid rgba(255,193,7,.22);background:rgba(255,193,7,.055);color:#e8d28b;border-radius:10px;font-size:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#0d1219;border:1px solid #1d2732;border-radius:12px;padding:18px}.stat span{display:block;color:#778391;font-size:10px}.stat strong{display:block;font:700 25px "Space Grotesk",sans-serif;margin-top:7px}.toolbar{display:flex;gap:10px;align-items:center;background:#0d1219;border:1px solid #1d2732;border-radius:12px;padding:13px;margin-bottom:16px}.toolbar input,.toolbar select{height:40px;background:#080c11;border:1px solid #202b36;border-radius:8px;color:#e8edf2;padding:0 11px;outline:none}.toolbar input{flex:1}.admin-btn{height:40px;padding:0 15px;border-radius:8px;border:1px solid #263340;background:#18212b;color:#dce5eb;font-weight:700;cursor:pointer}.admin-btn.primary{background:#20c997;border-color:#20c997;color:#03130d}.orders{background:#0d1219;border:1px solid #1d2732;border-radius:12px;overflow:hidden}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:900px}.admin-table th{background:#111820;color:#7e8a96;font-size:10px;text-transform:uppercase;letter-spacing:.6px}.admin-table th,.admin-table td{padding:13px 14px;border-bottom:1px solid #1a232d;text-align:left;font-size:11px}.admin-table td{color:#dbe2e8}.status{font-size:9px;font-weight:900;padding:5px 7px;border-radius:6px;background:#17202a;color:#9eabb8}.status.reported{background:rgba(255,193,7,.09);color:#e4c45d}.status.paid{background:rgba(80,150,255,.09);color:#76a9ff}.status.completed{background:rgba(32,201,151,.09);color:#4fe0b1}.details{display:none;background:#090e13}.details.open{display:table-row}.detail-box{padding:18px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail-grid div{padding:11px;background:#0e151c;border:1px solid #1b2630;border-radius:8px}.detail-grid span{display:block;color:#687684;font-size:9px}.detail-grid b{display:block;margin-top:5px;font-size:11px;word-break:break-all}.proof-img{max-width:280px;max-height:220px;border-radius:8px;border:1px solid #27323d;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{height:32px;padding:0 10px;border-radius:7px;border:1px solid #263340;background:#16202a;color:#dbe5eb;font-size:10px;font-weight:800;cursor:pointer}.mini.primary{background:#20c997;color:#03130d;border-color:#20c997}.proof-link{color:#20c997;text-decoration:underline}.empty{padding:35px;text-align:center;color:#71808c}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.admin-top{align-items:flex-start;flex-direction:column}.detail-grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.admin{width:calc(100% - 20px)}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}}
</style></head><body><div class="coin-bg" aria-hidden="true"><span class="cb c1">₿</span><span class="cb c2">Ξ</span><span class="cb c3">₮</span><span class="cb c4">◎</span><span class="cb c5">₿</span><span class="cb c6">◈</span><span class="cb c7">Ξ</span><span class="cb c8">₮</span><span class="cb c9">◎</span><span class="cb c10">₿</span><span class="cb c11">◈</span><span class="cb c12">Ξ</span></div><header class="navbar"><a href="index.html" class="logo"><div class="logo-icon">コ</div><div><span>コイン</span></div></a><div style="display:flex;gap:8px"><button class="secondary-button" onclick="logout()">Logout</button><a href="index.html" class="secondary-button">← Site</a></div></header><main class="admin"><div class="admin-top"><div><span class="eyebrow">OPERATOR CONSOLE</span><h1>Orders</h1></div><div class="admin-warning">PROTECTED OPERATOR PANEL — customer emails are automatic</div></div><div class="stats"><div class="stat"><span>Total orders</span><strong id="all">0</strong></div><div class="stat"><span>Awaiting payment</span><strong id="pending">0</strong></div><div class="stat"><span>Verify payment</span><strong id="reported">0</strong></div><div class="stat"><span>Completed</span><strong id="completed">0</strong></div></div><div class="toolbar"><input id="search" placeholder="Search reference, customer or wallet"><select id="filter"><option value="ALL">All statuses</option><option value="PENDING_PAYMENT">Pending payment</option><option value="PAYMENT_REPORTED">Verify payment</option><option value="PAID">Paid</option><option value="COMPLETED">Completed</option></select><button class="admin-btn primary" onclick="load()">Refresh</button><button class="admin-btn" onclick="testEmail()">Test customer email</button></div><section class="orders"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Reference</th><th>Customer</th><th>Amount</th><th>Total</th><th>Network</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let orders=[];const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function badge(s){const c=s==='PAYMENT_REPORTED'?'reported':s==='PAID'?'paid':s==='COMPLETED'?'completed':'';return `<span class="status ${c}">${esc(s.replaceAll('_',' '))}</span>`}function filtered(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;return orders.filter(o=>(f==='ALL'||o.status===f)&&(!q||[o.reference,o.customerName,o.walletAddress].join(' ').toLowerCase().includes(q)))}function render(){const list=filtered();document.getElementById('rows').innerHTML=list.length?list.map((o,i)=>`<tr><td><b>${esc(o.reference)}</b></td><td>${esc(o.customerName)}<br><small style="color:#64727e">${esc(o.customerEmail)}</small></td><td>${Number(o.amountUSDT).toFixed(2)} USDT</td><td>${Number(o.totalFiat).toFixed(2)} ${esc(o.currency)}</td><td>${esc(o.network)}</td><td>${badge(o.status)}</td><td><div class="actions"><button class="mini" onclick="toggle('${esc(o.reference)}')">Details</button>${o.status==='PAYMENT_REPORTED'?`<button class="mini primary" onclick="confirmPaid('${esc(o.reference)}')">Confirm paid</button>`:''}${o.status==='PAID'?`<button class="mini primary" onclick="complete('${esc(o.reference)}')">Mark sent</button>`:''}<button class="mini" onclick="resend('${esc(o.reference)}')">Resend email</button></div></td></tr><tr id="d-${esc(o.reference)}" class="details"><td colspan="7"><div class="detail-box"><div class="detail-grid"><div><span>Payment method</span><b>${esc(o.paymentMethod||'—')}</b></div><div><span>Payment reference</span><b>${esc(o.paymentReference||'—')}</b></div><div><span>Created</span><b>${esc(o.createdAt)}</b></div><div><span>Wallet</span><b>${esc(o.walletAddress)}</b></div><div><span>Proof</span><b>${o.hasProof?`<a class="proof-link" href="/api/admin/orders/${encodeURIComponent(o.reference)}/proof" target="_blank">📎 ${esc(o.proofOriginalName||'Open proof')}</a><br><small style="color:#667583">Uploaded ${esc(o.proofUploadedAt||'')}</small>`:'No proof'}</b></div><div><span>TXID</span><b>${esc(o.txid||'—')}</b></div><div><span>Updated</span><b>${esc(o.updatedAt)}</b></div><div><span>Last email</span><b>${esc(o.lastEmailStatus||'—')}${o.lastEmailError?`<br><small style="color:#e07a7a">${esc(o.lastEmailError)}</small>`:''}</b></div></div></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No orders found.</td></tr>'}function toggle(ref){const x=document.getElementById('d-'+ref);if(x)x.classList.toggle('open')}async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok)throw Error(d.message||'Action failed');return d}async function confirmPaid(ref){if(!confirm('Confirm that the payment has been verified?'))return;try{await api('/api/admin/orders/'+encodeURIComponent(ref)+'/confirm-payment');await load()}catch(e){alert(e.message)}}async function complete(ref){const txid=prompt('Enter the USDT transaction TXID/hash:');if(!txid)return;try{await api('/api/admin/orders/'+encodeURIComponent(ref)+'/mark-sent',{txid});await load()}catch(e){alert(e.message)}}async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.href="/admin-login.html"}async function resend(ref){try{const r=await fetch('/api/admin/orders/'+encodeURIComponent(ref)+'/resend-last',{method:'POST'});const d=await r.json();if(!r.ok)throw Error(d.email?.reason||d.message||'Email resend failed');alert('CUSTOMER EMAIL SENT.');await load()}catch(e){alert('EMAIL FAILED: '+e.message)}}
async function testEmail(){const ref=prompt("Order reference (optional). If blank, enter the recipient email next:");let to="";if(!ref)to=prompt("Recipient email for this real delivery test:")||"";try{const r=await fetch("/api/admin/email-test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reference:ref||undefined,to:to||undefined})});const d=await r.json();if(!r.ok)throw Error(d.message||d.email?.reason||"Email test failed");alert("EMAIL SENT. Check the recipient inbox/spam folder.");}catch(e){alert("EMAIL FAILED: "+e.message)}}async function load(){try{const r=await fetch('/api/admin/orders');const d=await r.json();if(!r.ok)throw Error(d.message||'Could not load orders');orders=d.orders||[];document.getElementById('all').textContent=orders.length;document.getElementById('pending').textContent=orders.filter(o=>o.status==='PENDING_PAYMENT').length;document.getElementById('reported').textContent=orders.filter(o=>o.status==='PAYMENT_REPORTED').length;document.getElementById('completed').textContent=orders.filter(o=>o.status==='COMPLETED').length;render()}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="7" class="empty">'+esc(e.message)+'</td></tr>'}}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;load();setInterval(load,10000);
</script></body></html>
